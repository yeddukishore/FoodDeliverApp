
name: iOS CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS App
        run: |
          xcodebuild \
            -project FoodDeliverApp.xcodeproj \
            -scheme FoodDeliverApp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run Unit Tests
        run: |
          xcodebuild \
            -project FoodDeliverApp.xcodeproj \
            -scheme FoodDeliverApp \
            -destination 'platform=iOS Simulator,name=iPhone 17'\
            CODE_SIGNING_ALLOWED=NO \
            test
     
      - name: Archive iOS App
        run: |
          xcodebuild \
            -project FoodDeliverApp.xcodeproj \
            -scheme FoodDeliverApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/FoodDeliverApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Upload Xcode Archive
        uses: actions/upload-artifact@v4
        with:
          name: FoodDeliverApp-Archive
          path: ${{ runner.temp }}/FoodDeliverApp.xcarchive
          if-no-files-found: error
          retention-days: 7



