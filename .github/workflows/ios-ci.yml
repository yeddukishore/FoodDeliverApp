
name: iOS CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build iOS App
        run: |
          xcodebuild \
            -project FoodDeliverApp.xcodeproj \
            -scheme FoodDeliverApp \
            -sdk iphonesimulator \
            -configuration Debug \
            build

